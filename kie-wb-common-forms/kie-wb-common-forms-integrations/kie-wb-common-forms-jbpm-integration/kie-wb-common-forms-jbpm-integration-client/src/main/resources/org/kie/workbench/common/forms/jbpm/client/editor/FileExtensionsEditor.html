<div class="form-group" data-field="formGroup">
    <label class="control-label" data-field="label">Allowed File Extensions</label>
    
    <div class="input-group">
        <input type="text" 
               class="form-control" 
               placeholder="e.g., pdf,docx,xlsx" 
               data-field="extensionsInput"
               title="Enter comma-separated file extensions (e.g., pdf,docx,xlsx)">
        <span class="input-group-addon" data-field="helpBlock">
            <i class="fa fa-info-circle"></i>
        </span>
    </div>
    
    <div class="help-block" data-field="helpBlock">
        Enter comma-separated file extensions. Leave empty to use global configuration.
    </div>
    
    <div class="margin-top-10" data-field="suggestionsPanel">
        <!-- Extension suggestions will be added here -->
    </div>
    
    <div class="margin-top-10" data-field="validationPanel">
        <!-- Validation details will be added here -->
    </div>
</div>
